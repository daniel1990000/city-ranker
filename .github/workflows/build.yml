name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# least privilege: only the release job can write (it creates the GitHub Release)
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Slower whole-game simulations (bot players, save fuzzing, course feasibility): they must stay green too.
  qa-sims:
    runs-on: ubuntu-24.04
    needs: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fight balance and economy simulations
        env:
          OUT: ${{ runner.temp }}/qa
          RUNS: '20'
        run: |
          mkdir -p "$OUT"
          OUT=$OUT/balance.md npx vitest run --config /dev/null scripts/qa/fight-balance.test.ts
          OUT=$OUT/econ.md npx vitest run --config /dev/null scripts/qa/econ-sim.test.ts
          cat "$OUT"/*.md >> "$GITHUB_STEP_SUMMARY"

  android:
    runs-on: ubuntu-24.04
    needs: web
    env:
      SIGNED_IN_CI: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # same rule as the release job below
      IS_RELEASE: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/ccr-ed639388-sb1q12' || github.ref_name == github.event.repository.default_branch) && contains(github.event.head_commit.message, '[release]')) || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK packages (runner ships the SDK)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          SM=$(ls -d $SDK/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | $SM --licenses > /dev/null || true
          $SM "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      - run: npm ci
      - name: Build web bundle (production ids come from repo secrets when set)
        env:
          VITE_ADMOB_REWARDED: ${{ secrets.ADMOB_REWARDED_ID }}
          VITE_ADMOB_INTERSTITIAL: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          VITE_ADMOB_TESTING: ${{ secrets.ADMOB_REWARDED_ID != '' && 'false' || 'true' }}
          # optional services (docs/RELEASE.md section 6): empty secrets leave them off
          VITE_ANALYTICS_KEY: ${{ secrets.ANALYTICS_KEY }}
          VITE_ANALYTICS_HOST: ${{ secrets.ANALYTICS_HOST }}
          VITE_REMOTE_CONFIG_URL: ${{ secrets.REMOTE_CONFIG_URL }}
          VITE_PRIVACY_URL: ${{ secrets.PRIVACY_URL }}
          VITE_PGS_LEADERBOARDS: ${{ secrets.PGS_LEADERBOARDS }}
          VITE_SHARE_URL: ${{ secrets.SHARE_URL }}
          VITE_SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          VITE_PGS_ACHIEVEMENTS: ${{ secrets.PGS_ACHIEVEMENTS }}
        run: npm run build && npx cap sync android
      - name: Set AdMob app id (if secret provided)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          PGS_PROJECT_ID: ${{ secrets.PGS_PROJECT_ID }}
        run: |
          if [ -n "$ADMOB_APP_ID" ]; then sed -i "s#ca-app-pub-3940256099942544~3347511713#${ADMOB_APP_ID}#" android/app/src/main/res/values/strings.xml; fi
          if [ -n "$PGS_PROJECT_ID" ]; then sed -i "s#<string name=\"game_services_project_id\" translatable=\"false\"></string>#<string name=\"game_services_project_id\" translatable=\"false\">${PGS_PROJECT_ID}</string>#" android/app/src/main/res/values/strings.xml; fi
      - name: Production config check (no Google test ad ids once real ones are configured)
        env:
          A: ${{ secrets.ADMOB_APP_ID != '' }}
          R: ${{ secrets.ADMOB_REWARDED_ID != '' }}
          I: ${{ secrets.ADMOB_INTERSTITIAL_ID != '' }}
        run: |
          # all three ad ids or none: a partial set would ship a build that mixes real and test ads
          if [ "$A$R$I" != "truetruetrue" ] && [ "$A$R$I" != "falsefalsefalse" ]; then echo "::error::Set all three ADMOB_* secrets (app, rewarded, interstitial), not only some"; exit 1; fi
          if grep -rq "3940256099942544" android/app/src/main/res/values/strings.xml android/app/src/main/assets/public; then
            if [ "$A" = "true" ]; then echo "::error::Google test ad ids are still in the build although production ids are set"; exit 1; fi
            echo "::warning::TEST-ADS BUILD: set the ADMOB_* secrets for a build that earns (docs/RELEASE.md section 2). Do not upload this one to Play."
          fi
      - name: Decode upload keystore (if secret provided)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/upload.jks && echo "CK_KEYSTORE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV; fi
      - name: Gradle build (APK + AAB)
        env:
          CK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease assembleDebug
      - name: Collect outputs
        run: |
          mkdir -p out
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk out/cagekings-$V-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk out/cagekings-$V.apk 2>/dev/null || cp android/app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          cp android/app/build/outputs/bundle/release/app-release.aab out/cagekings-$V.aab 2>/dev/null || true
          ls -la out
      - name: Check the release APK and AAB are signed with the upload key (when CI signs)
        if: env.SIGNED_IN_CI == 'true'
        env:
          # the upload key's SHA-256 certificate fingerprint (Settings > Secrets and variables > Actions > Variables)
          WANT: ${{ vars.UPLOAD_CERT_SHA256 }}
        run: |
          # Play refuses updates signed with any other key: fail here (wrong or mis-pasted secret), not at upload
          V=$(node -p "require('./package.json').version")
          APK=$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs out/cagekings-$V.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          AAB=$(keytool -printcert -jarfile out/cagekings-$V.aab | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          [ -n "$APK" ] || { echo "::error::The release APK is not signed. Check the ANDROID_KEY* secrets."; exit 1; }
          if [ -z "$WANT" ]; then echo "::warning::Set the UPLOAD_CERT_SHA256 repository variable to $APK to lock the upload key."; exit 0; fi
          [ "$APK" = "$WANT" ] || { echo "::error::The APK is not signed with the Cage Kings upload key (got '$APK'). Check the ANDROID_KEY* secrets."; exit 1; }
          [ "$AAB" = "$WANT" ] || { echo "::error::The AAB is not signed with the Cage Kings upload key (got '${AAB:-unsigned}'). Check the ANDROID_KEY* secrets."; exit 1; }
          echo "APK and AAB are signed with the Cage Kings upload key"
      # artifacts count against the account's small storage quota (every push filled it), so only the signed builds
      # a release publishes (or a manual run asks for) are kept, without the debug APK, for 3 days. The GitHub
      # Release holds the published files. A release needs the upload; a manual run does not.
      - uses: actions/upload-artifact@v4
        if: env.IS_RELEASE == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: ${{ env.IS_RELEASE != 'true' }}
        with:
          name: cagekings-android
          path: |
            out/*.apk
            out/*.aab
          retention-days: 3

  # A GitHub Release for version tags and [release] commits, only after every check above passed.
  # With signing secrets set it publishes the CI-built APK and AAB; until then a debug-signed test APK.
  release:
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/ccr-ed639388-sb1q12' || github.ref_name == github.event.repository.default_branch) && contains(github.event.head_commit.message, '[release]')) || startsWith(github.ref, 'refs/tags/v')
    needs: [web, qa-sims, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SIGNED_IN_CI: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: cagekings-android
          path: out
      - name: Pick the APK to publish
        id: pick
        run: |
          V=$(node -p "require('./package.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          mkdir -p publish
          if [ "$SIGNED_IN_CI" = "true" ]; then
            cp out/cagekings-$V.apk publish/CageKings-$V.apk
            cp out/cagekings-$V.aab publish/CageKings-$V.aab
          else
            # no signing secrets yet: publish the debug-signed build for testing (it cannot go to Google Play)
            cp out/cagekings-$V-debug.apk publish/CageKings-$V-test.apk
          fi
          ls -la publish
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pick.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Cage Kings ${{ steps.pick.outputs.v }} (Android)
          make_latest: true
          body: |
            **Download the Android app:** tap the **.apk** file below${{ env.SIGNED_IN_CI != 'true' && ' (a test build: the signing secrets are not set yet, so it is not for Google Play)' || '' }}.
            Open the downloaded file on your phone and tap **Install** (allow your browser to install apps if Android asks).
            It updates earlier versions in place and keeps your progress.
            ${{ env.SIGNED_IN_CI == 'true' && format('**For Google Play:** upload **CageKings-{0}.aab** in Play Console (it is signed with the upload key).', steps.pick.outputs.v) || '' }}
          files: |
            publish/*.apk
            publish/*.aab
