apply plugin: 'com.android.application'

// Release signing: create android/keystore.properties (never commit it) with
// storeFile=/abs/path/upload.jks, storePassword=..., keyAlias=..., keyPassword=...
// or provide CK_KEYSTORE / CK_KEYSTORE_PASSWORD / CK_KEY_ALIAS / CK_KEY_PASSWORD env vars (CI).
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
def ksPath = keystoreProps['storeFile'] ?: System.getenv('CK_KEYSTORE')

def pkgJson = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def pkgVersion = pkgJson.version as String
def pkgParts = pkgVersion.tokenize('.').collect { it.toInteger() }
def pkgVersionCode = pkgParts[0] * 10000 + pkgParts[1] * 100 + pkgParts[2]

android {
    namespace = "com.danielspurr.cagekings"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.danielspurr.cagekings"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // one source of truth: package.json (1.3.1 -> versionCode 10301)
        versionCode pkgVersionCode
        versionName pkgVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            // also leaves out web-only files: the mp3 copy of a track the app plays as ogg, the social preview image, PWA icons and service worker
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!afterburn.mp3:!og-image.png:!sw.js:!<dir>icons'
        }
    }
    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword keystoreProps['storePassword'] ?: System.getenv('CK_KEYSTORE_PASSWORD')
                keyAlias keystoreProps['keyAlias'] ?: System.getenv('CK_KEY_ALIAS')
                keyPassword keystoreProps['keyPassword'] ?: System.getenv('CK_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (ksPath) signingConfig signingConfigs.release
            // R8: shrink unused code and resources from the Google libraries (keep rules in proguard-rules.pro)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Play Games Services v2 (leaderboards, achievements, saved games) for the local PlayGamesPlugin
    implementation "com.google.android.gms:play-services-games-v2:21.0.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
